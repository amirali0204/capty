name: oidc
on:
  workflow_dispatch:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: get
        run: |
          echo "REQURL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "TOKLEN=${#TOK}"
          echo "HDR=$(echo "$TOK" | cut -d. -f1)"
          echo "PAY=$(echo "$TOK" | cut -d. -f2)"
          echo "TOKEN=$TOK"
